<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<!--
  Embeddable "now playing" widget. Drop it into any page:
    <iframe src="http://HOST/embed" width="440" height="112" style="border:0" loading="lazy"></iframe>
  Options (query string):  ?theme=dark | light   (default: follows the viewer's setting)
                           ?bg=transparent | card (default: card)
-->
<style>
  :root { --bg: #0d1117; --border: #30363d; --text: #f0f6fc; --muted: #8b949e; --track: #30363d; --accent: #1ed760; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme]) { --bg: #fff; --border: #d0d7de; --text: #1f2328; --muted: #656d76; --track: #d8dee4; }
  }
  :root[data-theme=light] { --bg: #fff; --border: #d0d7de; --text: #1f2328; --muted: #656d76; --track: #d8dee4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--text); }
  .card {
    display: flex; gap: 16px; align-items: center; height: 100%; min-height: 112px; padding: 16px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
  }
  :root[data-bg=transparent] .card { background: transparent; border-color: transparent; }
  .cover {
    flex: none; width: 80px; height: 80px; border-radius: 10px; background: var(--track) center/cover no-repeat;
    display: grid; place-items: center; color: var(--muted); font-size: 28px;
  }
  .info { flex: 1; min-width: 0; }
  .label { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; color: var(--accent); }
  .eq { display: inline-flex; gap: 3px; align-items: flex-end; height: 14px; }
  .eq i { display: block; width: 4px; height: 6px; border-radius: 1px; background: var(--accent); animation: bounce .9s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-duration: 1.1s; } .eq i:nth-child(3) { animation-duration: .8s; }
  .paused .eq i { animation: none; }
  @keyframes bounce { 0%,100% { height: 4px; } 25% { height: 12px; } 50% { height: 6px; } 75% { height: 14px; } }
  .title { margin-top: 6px; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 5px; border-radius: 3px; background: var(--track); margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); }
  .times { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="cover" id="cover">&#9834;</div>
  <div class="info">
    <div class="label"><span id="label">SPOTIFY</span><span class="eq"><i></i><i></i><i></i></span></div>
    <div class="title" id="title">Not playing right now</div>
    <div class="artist" id="artist">Check back later</div>
    <div class="bar"><div id="progress"></div></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
  </div>
</div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark' || params.get('theme') === 'light') {
    document.documentElement.dataset.theme = params.get('theme');
  }
  if (params.get('bg') === 'transparent') document.documentElement.dataset.bg = 'transparent';

  const $ = (id) => document.getElementById(id);
  const POLL_MS = 3000;
  let state = null, basis = null;

  const fmt = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };

  function position() {
    if (!state || !state.track || !basis) return 0;
    if (!state.playing) return basis.progressMs;
    return Math.min(state.track.durationMs, basis.progressMs + (performance.now() - basis.at));
  }

  function frame() {
    const t = state && state.track;
    if (t) {
      const pos = position();
      $('progress').style.width = (100 * pos / t.durationMs) + '%';
      $('pos').textContent = fmt(pos);
    }
    requestAnimationFrame(frame);
  }

  function show() {
    const t = state && state.track;
    $('card').classList.toggle('paused', !(t && state.playing));
    if (!t) {
      $('label').textContent = 'SPOTIFY';
      $('title').textContent = 'Not playing right now';
      $('artist').textContent = 'Check back later';
      $('cover').style.backgroundImage = '';
      $('cover').innerHTML = '&#9834;';
      $('progress').style.width = '0';
      $('pos').textContent = '0:00';
      $('dur').textContent = '0:00';
      return;
    }
    $('label').textContent = state.playing ? 'NOW PLAYING' : 'PAUSED';
    $('title').textContent = t.title;
    $('title').title = t.title;
    $('artist').textContent = t.artists.join(', ');
    $('dur').textContent = fmt(t.durationMs);
    const img = t.imageUrl ? 'url("' + t.imageUrl + '")' : '';
    $('cover').style.backgroundImage = img;
    $('cover').textContent = img ? '' : '♪';
  }

  async function poll() {
    try {
      const t0 = performance.now();
      const data = await (await fetch('/api/now', { cache: 'no-store' })).json();
      const rtt = performance.now() - t0;
      state = data;
      basis = { progressMs: data.progressMs || 0, at: performance.now() - rtt / 2 };
      show();
    } catch (e) { /* keep showing the last state */ }
    setTimeout(poll, POLL_MS);
  }

  requestAnimationFrame(frame);
  poll();
})();
</script>
</body>
</html>
